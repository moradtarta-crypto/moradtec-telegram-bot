name: MoradTec hourly video publishing

on:
  schedule:
    # GitHub cron is UTC; Algeria is UTC+1, so this runs at minute 00 every local hour.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moradtec-hourly-publisher-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SHRTFLY_API_TOKEN: ${{ secrets.SHRTFLY_API_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free FFmpeg encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate required secrets
        run: |
          test -n "$BOT_TOKEN" || (echo "::error::Add BOT_TOKEN to repository Actions secrets" && exit 1)
          test -n "$SHRTFLY_API_TOKEN" || (echo "::error::Add SHRTFLY_API_TOKEN to repository Actions secrets" && exit 1)
      - name: Publish one monetized post with a free MP4 video
        run: python scheduled_publish.py
