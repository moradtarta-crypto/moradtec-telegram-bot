name: MoradTec scheduled channel publishing

on:
  schedule:
    # Algeria is UTC+1: 10:00, 15:00, and 20:00 local time.
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which daily publishing slot to run"
        required: true
        type: choice
        options:
          - morning
          - afternoon
          - evening

permissions:
  contents: read

concurrency:
  group: moradtec-scheduled-publisher-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SHRTFLY_API_TOKEN: ${{ secrets.SHRTFLY_API_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      POST_SLOT: ${{ inputs.slot || (github.event.schedule == '0 9 * * *' && 'morning') || (github.event.schedule == '0 14 * * *' && 'afternoon') || (github.event.schedule == '0 19 * * *' && 'evening') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate required secrets
        run: |
          test -n "$BOT_TOKEN" || (echo "::error::Add BOT_TOKEN to repository Actions secrets" && exit 1)
          test -n "$SHRTFLY_API_TOKEN" || (echo "::error::Add SHRTFLY_API_TOKEN to repository Actions secrets" && exit 1)
          test -n "$POST_SLOT" || (echo "::error::Could not determine publishing slot" && exit 1)
      - name: Publish one monetized post
        run: python scheduled_publish.py
